<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Winkelmesser</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    .anzeige {
      width: 100%;
      padding: 0 clamp(16px, 4vw, 64px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      column-gap: clamp(12px, 3vw, 35px);
    }
    .linie {
      height: 2px;
      width: min(100%, 220px);
      background: #fff;
      border-radius: 999px;
    }
    .linie.links { justify-self: end; }
    .linie.rechts { justify-self: start; }
    #winkel {
      font-size: clamp(58px, 17vw, 178px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="anzeige" aria-label="Winkelmesser im Querformat">
    <div class="linie links" aria-hidden="true"></div>
    <div id="winkel" aria-live="off">–°</div>
    <div class="linie rechts" aria-hidden="true"></div>
  </main>
  <script>
    const anzeige = document.getElementById('winkel');
    let gravitation = null;
    let sanfterWinkel = null;
    let gezeigterWinkel = null;
    let letzteAnzeige = 0;
    let bewegungErkannt = false;

    function zeigeWinkel(grad) {
      if (!Number.isFinite(grad)) return;
      const winkel = Math.max(0, Math.min(90, grad));
      // Glätten, damit kleine Handbewegungen die Anzeige nicht springen lassen.
      sanfterWinkel = sanfterWinkel === null
        ? winkel
        : sanfterWinkel + 0.15 * (winkel - sanfterWinkel);

      const jetzt = performance.now();
      if (gezeigterWinkel !== null && jetzt - letzteAnzeige < 90) return;

      // Kleine Schwankungen ignorieren: Die ganze Gradzahl bleibt ruhig.
      if (gezeigterWinkel === null || Math.abs(sanfterWinkel - gezeigterWinkel) >= 0.75) {
        gezeigterWinkel = Math.round(sanfterWinkel);
        anzeige.textContent = gezeigterWinkel + '°';
        letzteAnzeige = jetzt;
      }
    }

    // Das Handy liegt quer: Die lange Kante entspricht der Geräte-Y-Achse.
    window.addEventListener('devicemotion', (event) => {
      const a = event.accelerationIncludingGravity;
      if (!a || !Number.isFinite(a.x) || !Number.isFinite(a.y) || !Number.isFinite(a.z)) return;
      const kraft = Math.hypot(a.x, a.y, a.z);
      if (kraft < 4 || kraft > 19) return;

      bewegungErkannt = true;
      if (!gravitation) {
        gravitation = { x: a.x, y: a.y, z: a.z };
      } else {
        const faktor = 0.10; // Beschleunigungssensor etwas stärker glätten.
        gravitation.x += faktor * (a.x - gravitation.x);
        gravitation.y += faktor * (a.y - gravitation.y);
        gravitation.z += faktor * (a.z - gravitation.z);
      }

      const grad = Math.atan2(
        Math.abs(gravitation.y),
        Math.hypot(gravitation.x, gravitation.z)
      ) * 180 / Math.PI;
      zeigeWinkel(grad);
    }, { passive: true });

    // Ersatz, falls der Browser keine Beschleunigungswerte liefert.
    window.addEventListener('deviceorientation', (event) => {
      if (bewegungErkannt || !Number.isFinite(event.beta)) return;
      let grad = Math.abs(event.beta) % 180;
      if (grad > 90) grad = 180 - grad;
      zeigeWinkel(grad);
    }, { passive: true });
  </script>
</body>
</html>
